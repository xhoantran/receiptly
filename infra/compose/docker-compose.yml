# Local-dev Postgres for receiptly (Phase 0 self-host stack).
#
#   docker compose -f infra/compose/docker-compose.yml up -d
#
# Then point the engine at it:
#   DATABASE_URL=postgres://receiptly:receiptly@localhost:5432/receiptly
#
# Apply migrations + seed the default user (from packages/core):
#   pnpm -C packages/core db:migrate   # or db:generate then apply
#   pnpm -C packages/core db:seed

services:
  postgres:
    image: postgres:18
    container_name: receiptly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: receiptly
      POSTGRES_PASSWORD: receiptly
      POSTGRES_DB: receiptly
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 stores data in a major-version subdirectory; mount the parent
      # (mounting /var/lib/postgresql/data directly crash-loops the 18+ image).
      - receiptly-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receiptly -d receiptly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  receiptly-pgdata:
