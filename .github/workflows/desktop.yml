name: Desktop build

# Builds the Electron desktop app (apps/desktop) into installers for macOS,
# Windows, and Linux.
#
#   • PR touching apps/desktop  → build on all three OSes (a CI check)
#   • Manual run (workflow_dispatch) → build + upload installers as artifacts
#   • Push a tag `desktop-v*`    → build + attach the installers to a GitHub Release
#
# Builds are UNSIGNED (no certificates in CI). To ship signed/notarized builds,
# add the signing secrets and drop CSC_IDENTITY_AUTO_DISCOVERY below. The app is a
# standalone npm package (its own package-lock.json), so it builds on its own.
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write # required for the release job to create a GitHub Release

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--mac"
          - os: windows-latest
            args: "--win"
          - os: ubuntu-latest
            args: "--linux"
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npx --no-install electron-builder ${{ matrix.args }} --publish never
        env:
          # No signing certs in CI → build unsigned. Provide certs + remove this
          # line (and add the platform signing env) to ship signed/notarized apps.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: receiptly-desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
